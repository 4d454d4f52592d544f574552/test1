version: '3.8'

services:
  url-redirect:
    build: .
    container_name: url-redirect
    ports:
      - "3000:3000"
    volumes:
      # Persist configuration files
      - ./data:/app/data
      # Mount config files if they exist locally (optional)
      - ./redirect-config.json:/app/redirect-config.json:ro
      - ./tunnels.json:/app/tunnels.json:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/test', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Uncomment to limit memory usage
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M

